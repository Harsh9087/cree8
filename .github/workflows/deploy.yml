
name: Deploy Cree8 to BigRock VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cree8-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Cree8
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Bootstrap host key collection.
          # For production, verify the VPS host fingerprint independently
          # and pin the verified host key instead.
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" \
            > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             cd /var/www/cree8
             git pull --ff-only origin main
             docker compose build backend frontend
             docker compose up -d --no-deps backend frontend
             docker compose ps backend frontend'
